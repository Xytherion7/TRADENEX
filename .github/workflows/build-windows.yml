name: Build TRADENEX for Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check and build desktop installer
        run: npm run tauri:build

      - name: Prepare single installer file
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer was not produced." }
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item $installer.FullName "release/TRADENEX-Setup-x64.exe" -Force

      - name: Upload one-file installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: TRADENEX-Setup-x64
          path: release/TRADENEX-Setup-x64.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release for version tags
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/TRADENEX-Setup-x64.exe
          generate_release_notes: true
